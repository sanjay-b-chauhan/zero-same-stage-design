<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kickoff film</title>
<!-- zero-kickoff v4 b1 -->
<style>
:root{--bg:#000;--s2:#141416;--s3:#1f1f22;--ln:#ececef;--ln2:rgba(236,236,239,.34);--ln3:rgba(236,236,239,.16);--t1:#f5f5f7;--t2:rgba(245,245,247,.6);--t3:rgba(245,245,247,.36);--up:#30d158;--dn:#ff453a;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0c0a;color:var(--t1);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#wrap{position:fixed;inset:0}
#view{position:absolute;overflow:hidden;background:#0b0c0a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}
.a{position:absolute;visibility:hidden}
.h1{font-size:84px;font-weight:600;letter-spacing:-.035em;line-height:1.04}
.h2{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1.08}
.h3{font-size:38px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.b{font-size:28px;font-weight:500;letter-spacing:-.015em}
.l{font-size:22px;font-weight:500;color:var(--t2);letter-spacing:-.01em}
.s{font-size:19px;font-weight:500;color:var(--t3)}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.line{border-radius:28px;box-shadow:inset 0 0 0 2px var(--ln2)}
.dash{border-radius:28px;border:2px dashed var(--ln2)}
.chip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:24px;box-shadow:inset 0 0 0 2px var(--ln2);font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.flag{display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.14);object-fit:cover}
.pp{display:block}
/* player */
#bar{display:flex;align-items:center;gap:14px;height:52px;padding:0 10px 0 6px;border-radius:26px;background:var(--s2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#bar .ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
#bar .ib:hover{background:var(--s3)}
#bar svg{width:20px;height:20px;fill:currentColor}
#seek{position:relative;width:min(520px,44vw);height:28px;cursor:pointer;touch-action:none}
#seek .tr{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:#2c2c2e}
#seek .wt{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
#seek .fi{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--t1)}
#time{font-size:13px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums;min-width:86px}
.tg{height:30px;min-width:44px;padding:0 10px;border-radius:15px;font-size:13px;font-weight:600;color:var(--t2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.tg.on{color:var(--t1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
#cap{min-height:30px;font-size:17px;font-weight:500;color:var(--t1);letter-spacing:-.01em;text-align:center;max-width:min(980px,92vw);line-height:1.4}
#cap.off{visibility:hidden}
#stamp{position:fixed;right:12px;bottom:8px;font-size:11px;font-weight:500;color:rgba(245,245,247,.32);pointer-events:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;z-index:5}
.over.off{display:none}
.key{height:56px;padding:0 30px;border-radius:28px;background:var(--t1);color:#000;font-size:19px;font-weight:600;letter-spacing:-.01em;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.key:active{transform:scale(.97)}
.ghost{font-size:16px;font-weight:500;color:var(--t2);height:40px;padding:0 16px}
.ghost:hover{color:var(--t1)}

/* ---------- Google Sheets (real UI at 1x, shown zoomed) ---------- */
.win{position:absolute;width:1080px;height:700px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 40px 80px rgba(0,0,0,.6);transform-origin:0 0;font-family:Roboto,Arial,sans-serif;color:#1f1f1f}
.chr{height:38px;background:#dfe3e8;display:flex;align-items:flex-end;padding:0 10px;gap:10px;position:relative}
.dots{position:absolute;left:14px;top:13px;display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:6px;display:block}
.tab{margin-left:76px;height:30px;width:250px;background:#fff;border-radius:9px 9px 0 0;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:#1f1f1f;white-space:nowrap;overflow:hidden}
.url{height:36px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #e3e3e3}
.url .box{flex:1;height:26px;border-radius:13px;background:#eef1f4;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#444}
.gh{height:62px;display:flex;align-items:center;padding:0 14px 0 12px;gap:10px;background:#f9fbfd}
.gh .ttl{font-size:18px;color:#1f1f1f;font-family:"Google Sans",Roboto,Arial,sans-serif}
.gh .mn{display:flex;gap:2px;font-size:14px;color:#1f1f1f;margin-top:3px;font-family:"Google Sans",Roboto,Arial,sans-serif}
.gh .mn span{padding:2px 7px;border-radius:4px}
.share{margin-left:auto;height:40px;padding:0 20px;border-radius:20px;background:#c2e7ff;color:#001d35;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;font-family:"Google Sans",Roboto,Arial,sans-serif}
.tb{margin:4px 12px 6px;height:40px;border-radius:20px;background:#edf2fa;display:flex;align-items:center;gap:4px;padding:0 10px;color:#444746;font-size:13px}
.tb svg{width:18px;height:18px;fill:#444746}.tb .sep{width:1px;height:20px;background:#c7c7c7;margin:0 6px}
.tb .t{padding:0 6px}
.fx{height:30px;display:flex;align-items:center;border-top:1px solid #e1e3e1;border-bottom:1px solid #e1e3e1;font-size:13px;background:#fff}
.fx .nb{width:92px;height:100%;display:flex;align-items:center;padding-left:10px;border-right:1px solid #e1e3e1;color:#1f1f1f}
.fx .fi2{width:36px;text-align:center;color:#80868b;font-style:italic;font-family:Georgia,serif;border-right:1px solid #e1e3e1}
.fx .fv{padding-left:10px;color:#1f1f1f}
.grid{position:relative;font-size:13px;background:#fff}
.grid .row{display:flex;height:21px}
.grid .c{border-right:1px solid #e1e1e1;border-bottom:1px solid #e1e1e1;padding:0 4px;line-height:20px;white-space:nowrap;overflow:hidden;flex:none}
.grid .rh{width:46px;text-align:center;color:#444746;background:#f8f9fa;font-size:11px;border-right:1px solid #c4c7c5}
.grid .hd .c{background:#f8f9fa;color:#444746;text-align:center;font-size:11px;border-bottom:1px solid #c4c7c5}
.grid .r{text-align:right}
.grid .c.bad{background:#fce8e6;color:#b3261e}
.sel{position:absolute;border:2px solid #1a73e8;background:rgba(26,115,232,.08);pointer-events:none;visibility:hidden}
.sel i{position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:#1a73e8;border:1px solid #fff}
.sh{position:absolute;left:0;right:0;bottom:0;height:40px;background:#f9fbfd;border-top:1px solid #e1e3e1;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:13px;color:#444746}
.sh .act{height:30px;padding:0 14px;border-radius:15px;background:#e1e9f7;color:#0b57d0;display:flex;align-items:center;font-weight:500}

/* ---------- Claude (real UI, light) ---------- */
.cl{position:absolute;width:1120px;height:680px;border-radius:12px;overflow:hidden;background:#faf9f5;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 40px 80px rgba(0,0,0,.6);transform-origin:0 0;display:flex;color:#141413;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.cl .sb{width:220px;background:#f5f4ed;border-right:1px solid #e8e6dc;padding:14px 10px;font-size:13px;color:#3d3d3a}
.cl .wm{font-family:"Copernicus","Tiempos Headline",Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:-.02em;padding:0 6px 14px;color:#141413}
.cl .it{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:8px}
.cl .it svg{width:16px;height:16px;stroke:#3d3d3a;fill:none;stroke-width:1.6}
.cl .rc{font-size:11px;color:#83827d;padding:16px 8px 6px}
.cl .it.on{background:#ebe9e1}
.cl .mainc{flex:1;position:relative}
.cl .tt{height:48px;display:flex;align-items:center;padding:0 20px;font-size:14px;color:#3d3d3a}
.cl .th{position:absolute;left:0;right:0;top:48px;bottom:112px;padding:10px 0 0;overflow:hidden}
.cl .col{width:640px;margin:0 auto}
.cl .ub{margin-left:auto;max-width:440px;background:#f0eee6;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.5}
.cl .att{margin:0 0 8px auto;width:260px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8e6dc;border-radius:10px;padding:10px 12px;font-size:13px}
.cl .att .ic{width:34px;height:40px;border-radius:6px;background:#0f9d58;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.cl .att .m{font-size:11px;color:#83827d}
.cl .rp{font-family:"Anthropic Serif","Tiempos Text",Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6;color:#141413;margin-top:22px}
.cl .rp b{font-weight:600}
.cl .rp ul{padding-left:22px;margin:6px 0}
.cl .art{margin-top:14px;width:340px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e8e6dc;border-radius:12px;padding:12px 14px;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;font-size:13.5px;visibility:hidden}
.cl .comp{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:640px;height:84px;background:#fff;border-radius:18px;box-shadow:0 0 0 1px #e8e6dc,0 4px 16px rgba(0,0,0,.04);padding:14px 16px;font-size:14.5px;color:#83827d}
.cl .comp .row2{position:absolute;left:14px;right:12px;bottom:10px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#3d3d3a}
.cl .send{width:30px;height:30px;border-radius:8px;background:#d97757;display:flex;align-items:center;justify-content:center}
.cl .disc{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#83827d}
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <div id="stage"><div id="world"></div></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="pg" viewBox="0 0 40 40"><circle cx="20" cy="13" r="6.2" fill="none" stroke="#ececef" stroke-width="2.2"/><path d="M9.5 33.5a10.5 10.5 0 0 1 21 0" fill="none" stroke="#ececef" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="pgd" viewBox="0 0 40 40"><circle cx="20" cy="13" r="6.2" fill="none" stroke="#ececef" stroke-width="2.2" stroke-dasharray="3 3.2"/><path d="M9.5 33.5a10.5 10.5 0 0 1 21 0" fill="none" stroke="#ececef" stroke-width="2.2" stroke-dasharray="3 3.2"/></symbol>
  <pattern id="crowd" width="40" height="40" patternUnits="userSpaceOnUse"><use href="#pg" width="40" height="40"/></pattern>
</defs></svg>
<script>
const DATA = {"lines":[{"t":0,"e":2.944,"x":"Hey, I'm Eryn. I'll be your manager on this one."},{"t":3.224,"e":5.101,"x":"Quick question before we start."},{"t":5.381,"e":9.136,"x":"If Spotify charged you one more dollar a month, would you cancel?"},{"t":9.416,"e":11.443,"x":"Most people wouldn't. Some would."},{"t":11.723,"e":13.771,"x":"And that gap is the whole project."},{"t":14.571,"e":18.837,"x":"Picture a room with a hundred people in it, all paying eleven ninety-nine."},{"t":19.117,"e":21.101,"x":"We raise it to twelve ninety-nine."},{"t":21.381,"e":24.24,"x":"If ninety-five people stay, we make more money."},{"t":24.52,"e":27.357,"x":"But if ninety-two stay, we actually make less."},{"t":27.637,"e":31.925,"x":"So a dollar's only worth it when fewer than eight people walk out of the room."},{"t":32.725,"e":36.395,"x":"Now, last year Spotify raised Premium in six markets."},{"t":36.675,"e":40.429,"x":"The US, Mexico, Brazil, the UK, Germany, and India."},{"t":40.709,"e":41.755,"x":"Six rooms."},{"t":42.035,"e":45.789,"x":"In some, almost nobody left. In others, people walked."},{"t":46.069,"e":50.101,"x":"And leadership wants to know which room we raise next, and by how much."},{"t":50.901,"e":55.189,"x":"Here's the catch. Nobody can answer that yet, 'cause the data's a mess."},{"t":55.469,"e":58.755,"x":"We pulled the raw export, and there are ten things wrong with it."},{"t":59.035,"e":60.4,"x":"Negative prices."},{"t":60.68,"e":63.133,"x":"Test accounts mixed in with real people."},{"t":63.413,"e":65.376,"x":"Dates written three different ways."},{"t":65.656,"e":69.176,"x":"Count people from a broken list, and you're counting the wrong room."},{"t":69.976,"e":71.619,"x":"So what does good look like?"},{"t":71.899,"e":73.285,"x":"One recommendation."},{"t":73.565,"e":75.784,"x":"Not three options, and not a maybe."},{"t":76.064,"e":80.864,"x":"One market, one new price, and the numbers that prove it's worth the people you lose."},{"t":81.144,"e":83.512,"x":"A call you'd defend in front of leadership."},{"t":84.312,"e":86.147,"x":"You'll get there in five stages."},{"t":86.427,"e":93.232,"x":"First, you clean the data. That's about fifteen minutes, and once you've found the problems, Claude does the heavy lifting."},{"t":93.512,"e":99.037,"x":"Second, the revenue model. Twenty-five minutes. That's the big one, where you count every room."},{"t":99.317,"e":100.747,"x":"Third, you make the call."},{"t":101.027,"e":102.627,"x":"Fourth, you write the memo."},{"t":102.907,"e":104.571,"x":"And last, you present it."},{"t":104.851,"e":106.941,"x":"About eighty minutes, start to finish."},{"t":107.741,"e":113.309,"x":"And you're not doing this alone. I'm right here the whole way, so if you get stuck, just ask me."},{"t":113.589,"e":116.491,"x":"Alright. Let's go find the room where nobody leaves."},{"t":116.771,"e":120.12,"x":"Open the export, and tell me the first thing that looks wrong."}],"dur":120.12};
const A = {"f_gb":"flags/gb.svg","f_in":"flags/in.svg","f_us":"flags/us.svg","f_br":"flags/br.svg","f_mx":"flags/mx.svg","f_de":"flags/de.svg","l_f-csv":"logos/f-csv.svg","l_spotify":"logos/spotify.svg","l_sheets":"logos/logo-sheets.svg","l_claude":"logos/logo-claude.svg","face":"../../faces/eryn.webp"};
const LN = DATA.lines;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
// critically damped spring, settles at x = 1 (damping 1, no overshoot, no wobble)
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - (1 + 8 * x) * Math.exp(-8 * x)) / (1 - 9 * Math.exp(-8));
// cue times come from the voice: "L6" = line 6 starts, "L6@.5" = halfway through it, "L6e" = it ends, "+0.3" shifts
const T = s => {
  if (s == null || s === '') return null; if (typeof s === 'number') return s;
  const m = String(s).match(/^L(\d+)(e|@[\d.]+)?([+-][\d.]+)?$/); if (!m) { const n = parseFloat(s); return isNaN(n) ? (console.warn('cue?', s), null) : n; }
  const l = LN[+m[1] - 1]; if (!l) { console.warn('cue?', s); return null; }
  let t = m[2] === 'e' ? l.e : m[2] ? l.t + parseFloat(m[2].slice(1)) * (l.e - l.t) : l.t;
  return t + (m[3] ? parseFloat(m[3]) : 0);
};
const flag = (k, w, h) => `<img src="${A['f_' + k]}" class="flag" style="width:${w}px;height:${h}px" alt="">`;
const logo = (k, s) => `<img src="${A['l_' + k]}" style="width:${s}px;height:${s}px;display:block" alt="">`;
const peep = (k, h) => `<img src="${A['p_' + k]}" class="pp" style="height:${h}px" alt="">`;
// el(in, x, y, html, {out, m, id, st, dx}) : world coordinates; a group arrives as one piece
const el = (inn, x, y, html, o = {}) => `<div class="a ${o.cls || ''}" data-in="${inn}" ${o.out ? `data-out="${o.out}"` : ''} ${o.m ? `data-m="${o.m}"` : ''} ${o.dx != null ? `data-dx="${o.dx}"` : ''} ${o.id ? `id="${o.id}"` : ''} style="left:${x}px;top:${y}px;${o.st || ''}">${html}</div>`;
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const MK = [['us', 'United States', '$11.99'], ['mx', 'Mexico', 'MX$139'], ['br', 'Brazil', 'R$23.90'], ['gb', 'United Kingdom', '£11.99'], ['de', 'Germany', '€11.99'], ['in', 'India', '₹119']];
const H = [];

/* ============ 1. hook (frame 0,0) ============ */
H.push(`
  ${el('L2+0.1', 900, 300, `<div class="line" style="width:620px;padding:40px 44px">
      <div style="display:flex;align-items:center;gap:14px">${logo('spotify', 40)}<div class="b nw">Premium Individual</div></div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-top:24px"><div id="hprice" class="num" style="font-size:108px;font-weight:600;letter-spacing:-.04em">$11.99</div><div class="l">/ month</div></div></div>`)}
  ${el('L3@.5', 1550, 390, `<div class="chip num">+ $1</div>`, { m: 'pop' })}
  ${el('L4', 900, 640, `<div style="position:relative;width:640px;height:56px">${Array.from({ length: 10 }, (_, i) => `<svg width="56" height="56" style="position:absolute;left:${i * 62}px;top:0" ${i === 9 ? 'id="hleave"' : ''}><use href="#pg"/></svg>`).join('')}</div>`)}`);

/* ============ 2. the room (detail frame at 2200,0) ============ */
// a room is 480 x 480, people sit on a 40px grid, the door is the gap in the right wall
const ROOM = (id, pre = '') => `<svg width="560" height="480" viewBox="0 0 560 480" style="overflow:visible;display:block" ${id ? `id="${id}"` : ''}>
  <path d="M480 70V32a32 32 0 0 0-32-32H32A32 32 0 0 0 0 32v416a32 32 0 0 0 32 32h416a32 32 0 0 0 32-32v-38" fill="none" stroke="rgba(236,236,239,.34)" stroke-width="2"/>${pre}</svg>`;
const RX = 2500, RY = 300;                            // the US room, also the first of six
const LEAVE5 = [3, 4, 5, 6, 7], LEAVE3 = [1, 2, 8];  // seats in the last column, next to the door
H.push(`
  ${el('L6', RX, RY - 100, `<div style="display:flex;align-items:center;gap:16px">${flag('us', 48, 36)}<div class="b nw">United States</div><div class="chip num" id="rprice" style="height:42px;font-size:20px">$11.99</div></div>`)}
  ${el('L6', RX, RY, ROOM('room0', `<rect x="40" y="40" width="360" height="400" fill="url(#crowd)"/>${Array.from({ length: 10 }, (_, r) => `<use href="#pg" x="400" y="${40 + r * 40}" width="40" height="40" class="seat" data-r="${r}"/>`).join('')}`))}
  ${el('L6@.55', RX + 650, RY + 10, `<div class="s">People</div><div id="rn" class="num" style="font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1.05">100</div>
      <div class="s" style="margin-top:28px">Each month</div><div id="rrev" class="num" style="font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1.05">$1,199</div>
      <div id="rwas" class="l num" style="margin-top:6px;visibility:hidden">was $1,199</div>`, { out: 'L11-0.2' })}
  ${el('L8', RX + 650, RY + 470, `<div style="position:relative;width:560px;height:120px">
      <div class="s" style="position:absolute;left:0;top:0">Walked out</div>
      <div style="position:absolute;left:0;top:58px;width:${7.5 / 12 * 560}px;height:4px;border-radius:2px;background:var(--up)"></div>
      <div style="position:absolute;left:${7.5 / 12 * 560}px;top:58px;width:${4.5 / 12 * 560}px;height:4px;border-radius:2px;background:var(--dn)"></div>
      ${Array.from({ length: 13 }, (_, i) => `<div style="position:absolute;left:${i / 12 * 560 - 1}px;top:${i % 2 ? 70 : 68}px;width:2px;height:${i % 2 ? 6 : 10}px;background:var(--ln3)"></div>${i % 2 ? '' : `<div class="s num" style="position:absolute;left:${i / 12 * 560 - 20}px;top:86px;width:40px;text-align:center;font-size:16px">${i}</div>`}`).join('')}
